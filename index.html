<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prabhas Letter Face Animation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <div class="character">
        <div class="back-glow"></div>

        <div class="head-wrap">
          <div class="hair"></div>
          <div class="head">
            <div class="letter-field" id="letterField"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>
        </div>

        <div class="neck"></div>

        <div class="torso">
          <div class="upper-cloth"></div>
          <div class="belt"></div>
          <div class="lower-cloth"></div>
        </div>

        <div class="arm left">
          <div class="arm-sleeve"></div>
        </div>
        <div class="arm right">
          <div class="arm-sleeve"></div>
        </div>

        <div class="legs">
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
